[project]
name = "person-extractor-v4"
version = "4.0.0"
description = "Offline, explainable person name extraction (TXT, PDF, CSV, JSON, HTML, XML, DOCX, EML) with a 16-validator rules engine and a LightGBM corroborating classifier."
requires-python = ">=3.10"
readme = "README.md"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
